name: polymarket

# 폴리마켓 미국 중간선거 확률 수동 발송. (정각 발송은 wscn 릴레이가 한다) 한시 운영:
# scripts/polymarket.py 의 DEADLINE(11/3 00:00 KST + 여유 1시간) 이후엔
# 크론이 깨워도 스스로 건너뛴다. 끝나면 이 파일을 지우면 된다.

on:
  # 정각 발송은 wscn 릴레이 루프(polymarket_tick)가 한다. GitHub 크론은 지연·
  # 누락이 심해 매시 크론이 한 번도 안 떴다. 여기는 수동 발송용으로만 남긴다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polymarket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: polymarket
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send Polymarket midterm odds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/polymarket.py
