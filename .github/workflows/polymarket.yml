name: polymarket

# 폴리마켓 미국 중간선거 확률을 1시간마다 보낸다. 한시 운영:
# scripts/polymarket.py 의 DEADLINE(11/3 00:00 KST + 여유 1시간) 이후엔
# 크론이 깨워도 스스로 건너뛴다. 끝나면 이 파일을 지우면 된다.

on:
  workflow_dispatch:
  schedule:
    # 매시 정각 (1시간 간격). 정각은 GitHub 스케줄이 몰려 지연이 심해
    # 2분 비켜 둔다.
    - cron: "2 * * * *"

permissions:
  contents: read

jobs:
  polymarket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: polymarket
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send Polymarket midterm odds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/polymarket.py
