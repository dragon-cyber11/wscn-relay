name: wscn

on:
  workflow_dispatch:
    inputs:
      init_only:
        description: "1이면 초기화만 하고 전송 안 함"
        required: false
        default: "0"
  schedule:
    - cron: "*/20 * * * *"

# 기본은 읽기만. 필요한 권한은 잡별로 최소한만 올린다.
permissions:
  contents: read

jobs:
  # ── 감시견: 20분마다 하트비트 확인, 30분 무응답이면 릴레이 재시작 ──
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read      # 체크아웃만
      actions: write      # 멎은 릴레이 취소 + 새 릴레이 호출
    # 릴레이와 다른 그룹이어야 릴레이가 도는 동안에도 감시견이 실행됨
    concurrency:
      group: wscn-watchdog
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check heartbeat & restart if stale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          HB=.state/wscn_heartbeat.txt
          STALE=1
          NOTIFY=1          # 하트비트 파일 자체가 없으면 무조건 알린다
          AGE=0
          if [ -f "$HB" ]; then
            cat "$HB"
            LAST=$(git log -1 --format=%ct -- "$HB")
            AGE=$(( $(date +%s) - ${LAST:-0} ))
            echo "heartbeat age = ${AGE}s"
            [ "$AGE" -le 1800 ] && STALE=0
            # 무응답이 길어지면 20분마다 같은 경고가 쏟아진다.
            # 최초 감지(임계 30분 직후 한 틱) + 이후 1시간에 한 번만 알린다.
            if [ "$AGE" -lt 3000 ] || [ $(( AGE % 3600 )) -lt 1200 ]; then
              NOTIFY=1
            else
              NOTIFY=0
            fi
          else
            echo "no heartbeat file"
          fi

          if [ "$STALE" = "0" ]; then
            echo "alive, nothing to do"
            exit 0
          fi

          if [ "$NOTIFY" = "1" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🐕 wscn 릴레이 무응답(${AGE}초) — 감시견이 재시작합니다" >/dev/null || true
          else
            echo "alert suppressed (cooldown)"
          fi

          # 릴레이는 concurrency 그룹으로 직렬화된다. 멎은 잡을 먼저 취소하지 않으면
          # 새로 dispatch 해봐야 pending 큐에서 최대 6시간 대기만 하다 끝난다.
          # (같은 워크플로 파일이라 감시견 자기 자신도 목록에 나오므로 반드시 제외)
          RUNNING=$(gh run list --workflow=wscn.yml --status=in_progress \
                      --limit 30 --json databaseId \
                    | jq -r --arg me "${GITHUB_RUN_ID}" \
                        '.[] | select((.databaseId|tostring) != $me) | .databaseId')
          for id in $RUNNING; do
            echo "cancel stuck relay run $id"
            gh run cancel "$id" || true
          done
          if [ -n "$RUNNING" ]; then
            echo "waiting for cancellation to settle..."
            sleep 20
          fi

          gh workflow run wscn.yml --ref main -f init_only=0

  # ── 릴레이 본체: 5시간 50분 돌고 스스로 다음 잡 호출 ──
  relay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write     # .state 커밋/푸시
      actions: write      # 다음 잡 체이닝
    # 릴레이는 절대 두 개가 동시에 돌면 안 됨 (중복 발송)
    concurrency:
      group: wscn-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 대기열에 오래 있던 잡이 옛날 상태로 시작하는 것 방지
      - name: Force sync to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git log -1 --oneline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python3 -m py_compile scripts/wscn_relay.py && echo "script OK"

      - name: Run relay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WSCN_CHANNEL: global
          FILTER_NOISE: "1"     # 0 으로 두면 필터 끄고 전부 받음
          INIT_ONLY: ${{ inputs.init_only }}
          # 403 차단으로 잡을 끝낼 때 이만큼 쉬었다 나간다.
          # 즉시 나가면 체인이 곧바로 새 잡을 띄워 시간당 30회씩 재시작한다.
          BLOCK_COOLDOWN: "300"
        run: |
          set +e
          if [ "$INIT_ONLY" = "1" ]; then
            RUN_SECONDS=60 python3 scripts/wscn_relay.py
            echo "init exit=$?"
            exit 0
          fi
          END=$(( $(date +%s) + 21000 ))
          while [ $(date +%s) -lt $END ]; do
            RUN_SECONDS=600 python3 scripts/wscn_relay.py
            RC=$?
            if [ "$RC" = "2" ]; then
              echo "=== runner IP blocked (403) -> ${BLOCK_COOLDOWN}초 대기 후 새 러너를 받는다 ==="
              sleep "$BLOCK_COOLDOWN"
              break
            fi
            echo "--- cycle ended, restarting ---"
            sleep 2
          done

      # 주 방식: 끝나기 직전 스스로 다음 잡 호출 (cron을 믿지 않음)
      # always() 를 쓰면 취소해도 되살아나므로 success/failure 만
      - name: Chain next run
        if: (success() || failure()) && inputs.init_only != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run wscn.yml --ref main -f init_only=0 || echo "chain failed"
