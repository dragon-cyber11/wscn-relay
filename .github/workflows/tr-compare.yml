name: tr-compare
# 일회성 번역 모델 비교(텔레그램 발송 없음). 확인 후 삭제한다.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: x
          TELEGRAM_CHAT_ID: x
        run: python3 scripts/tr_compare.py
