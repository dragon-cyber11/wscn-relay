name: fng

# CNN 공포·탐욕 지수 + 지역별 시황 수동 발송용.
# 정규 발송(아시아·유럽·미국 시황, 공탐 장중·마감)은 wscn 릴레이 루프의
# scheduled_tick 이 현지 시각에 맞춰 한다. 여기는 놓쳤을 때 손으로 보내는 버튼이다.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "시황 강제 발송: asia | europe | us_am(미국 오전) | us (비우면 미국 마감)"
        required: false
        default: ""
  # 정규 발송은 wscn 릴레이 루프(scheduled_tick)가 한다. 예약 실행이 1~1.5시간씩
  # 밀려서(11월 실측) 여기는 수동 발송용으로만 남긴다.

permissions:
  contents: read

jobs:
  fng:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: fng
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Fear & Greed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 어느 cron 이 깨웠는지. 스케줄이 지연돼도 발송 시점 판정이 안 흔들린다.
          FNG_SCHEDULE: ${{ github.event.schedule }}
          # 수동 실행은 시간대 판정을 건너뛰고 무조건 보낸다.
          FNG_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/fng.py

      # 마감 시황. 미국 슬롯에서는 F&G 다음에 미국 시황이 나가고, 아시아·유럽
      # 슬롯에서는 F&G 가 건너뛴 뒤 해당 지역 시황만 나간다. 자기 슬롯이 아니면
      # market.py 가 스스로 건너뛴다(종료코드 0). 앞 단계가 실패해도 보내도록
      # always() 를 쓴다. 수동 실행 지역은 region 입력으로 지정(비우면 미국).
      - name: Send market close summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_REGION: ${{ github.event.inputs.region }}
          # 어느 cron 이 깨웠는지. 스케줄이 지연돼도 지역 판정이 안 흔들린다.
          MARKET_SCHEDULE: ${{ github.event.schedule }}
          FNG_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/market.py
