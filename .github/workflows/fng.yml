name: fng

# CNN 공포·탐욕 지수를 하루 두 번 텔레그램으로 보낸다.
# 릴레이(wscn.yml)와 분리한 이유: 릴레이는 5시간 50분짜리 장기 잡이라
# 하루 2회 단발 작업과 수명 주기가 맞지 않는다. 여기가 죽어도 속보 중계는
# 영향을 받지 않는다.

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron 은 UTC 고정이라 서머타임을 못 따라간다.
    # 그래서 서머타임(EDT)/표준시(EST) 후보 시각 양쪽에 cron 을 걸어두고,
    # 실제로 보낼지는 scripts/fng.py 가 뉴욕 현지시각을 보고 정한다.
    # 계절마다 어느 한쪽만 발송되고 나머지는 조용히 건너뛴다.
    # 시각을 바꾸려면 fng.py 의 PHASES 와 아래 네 줄을 같이 고친다.
    - cron: "0 17 * * 1-5"     # 장중 13:00 ET (EDT) — KST 02:00
    - cron: "0 18 * * 1-5"     # 장중 13:00 ET (EST) — KST 03:00
    - cron: "30 21 * * 1-5"    # 마감 17:30 ET (EDT) — KST 06:30
    - cron: "30 22 * * 1-5"    # 마감 17:30 ET (EST) — KST 07:30

permissions:
  contents: read

jobs:
  fng:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fng
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Fear & Greed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행은 시간대 판정을 건너뛰고 무조건 보낸다.
          FNG_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/fng.py

      # 마감 시황은 공포탐욕지수 다음에 나간다. 장중 슬롯에서는
      # market.py 가 스스로 판단해 건너뛴다(종료코드 0).
      # 앞 단계가 실패해도 시황은 보내도록 always() 를 쓴다.
      - name: Send market close summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FNG_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/market.py
