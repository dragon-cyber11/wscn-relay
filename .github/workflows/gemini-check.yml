name: gemini-check

# 1회용 점검: GEMINI_API_KEY 가 들어갔는지, 실제 번역이 어떻게 나오는지 로그로만
# 확인한다. 텔레그램엔 아무것도 보내지 않는다. 확인 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Translate samples (Gemini vs Google)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: scripts
        run: |
          python3 - <<'PY'
          import json, time, wscn_relay as w
          print("키 있음:", bool(w.GEMINI_KEY))
          d = w.http_json("/apiv1/content/lives?channel=global&accept=live&limit=15")
          seen = []
          for it in (d.get("data") or {}).get("items") or []:
              t = w.clean(it.get("title") or it.get("content_text") or "")[:200] if hasattr(w, "clean") else (it.get("title") or "")
              if t and t not in seen and not w.noise_reason(t)[0]:
                  seen.append(t)
          for t in seen[:6]:
              t0 = time.time(); g = w.gemini_translate(t, "Chinese"); dt = time.time() - t0
              w._tr.clear(); saved = w.GEMINI_KEY; w.GEMINI_KEY = ""
              goo = w.translate(t); w.GEMINI_KEY = saved
              print("\n원문  :", t)
              print("Gemini: %s  (%.1f초)" % (g, dt))
              print("구글  :", goo)
          print("\n선택된 모델:", w._gem_model)
          PY
